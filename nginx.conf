events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream game_api {
        server go-1:8080;
        server go-2:8080;
        server go-3:8080;
    }

    # SSE uses sticky routing per player
    map $arg_playerId $sse_backend {
        "light" go-1:8080;
        "dark"  go-2:8080;
        default go-1:8080;
    }

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;
        resolver 127.0.0.11 valid=30s ipv6=off;

        # Serve UI static files directly
        location / {
            try_files $uri $uri/ /index.html;
        }

        # SSE — long-lived, player-sticky
        location /events {
            proxy_pass http://$sse_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_set_header Host $host;
        }

        # API endpoints — match only full path prefixes, not static files like /game.js
        location ~ ^/(order$|orders/|game/|analysis/|health$) {
            proxy_pass http://game_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
